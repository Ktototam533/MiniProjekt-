
<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>myLGS Ideenmagnet</title>

    <link rel="stylesheet" href="CSS/style.css">
    <script src="JS/script.js" defer></script>
</head>

<body>

    <main class="login-container">

        <section class="card">

            <div class="logo">✦</div>

            <h1>myLGS Ideenmagnet</h1>

            <p class="subtitle">
                Deine Schule. Deine Ideen. Deine Stimme.
            </p>


            <!-- TABS -->

            <div class="tabs">

                <button
                    type="button"
                    class="tab active"
                    data-tab="login">
                    Anmelden
                </button>

                <button
                    type="button"
                    class="tab"
                    data-tab="register">
                    Registrieren
                </button>

            </div>


            <!-- ANMELDUNG -->

            <form id="login-form" class="auth-form">

                <label for="login-email">
                    Schul-E-Mail-Adresse
                </label>

                <input
                    id="login-email"
                    name="email"
                    type="email"
                    placeholder="name@lgs-di.de"
                    autocomplete="username"
                    required
                >


                <label for="login-password">
                    Passwort
                </label>

                <input
                    id="login-password"
                    name="password"
                    type="password"
                    placeholder="Dein Passwort"
                    autocomplete="current-password"
                    required
                >


                <button type="submit">
                    Anmelden
                </button>

            </form>


            <!-- REGISTRIERUNG -->

            <form id="register-form" class="auth-form hidden">

                <label for="register-email">
                    Schul-E-Mail-Adresse
                </label>

                <input
                    id="register-email"
                    name="email"
                    type="email"
                    placeholder="name@lgs-di.de"
                    autocomplete="email"
                    required
                >


                <label for="nickname">
                    Nickname
                </label>

                <input
                    id="nickname"
                    name="nickname"
                    type="text"
                    minlength="2"
                    maxlength="30"
                    placeholder="Dein Nickname"
                    autocomplete="nickname"
                    required
                >


                <label for="register-password">
                    Passwort
                </label>

                <input
                    id="register-password"
                    name="password"
                    type="password"
                    minlength="8"
                    placeholder="Mindestens 8 Zeichen"
                    autocomplete="new-password"
                    required
                >


                <label for="confirm-password">
                    Passwort wiederholen
                </label>

                <input
                    id="confirm-password"
                    name="confirm_password"
                    type="password"
                    minlength="8"
                    placeholder="Passwort erneut eingeben"
                    autocomplete="new-password"
                    required
                >


                <button type="submit">
                    Konto erstellen
                </button>

                <p class="footer-text">
                    Nach der Registrierung erhältst du
                    eine E-Mail zur Bestätigung deiner Adresse.
                </p>

            </form>


            <!-- NACHRICHTEN -->

            <p
                id="message"
                class="message"
                aria-live="polite">
            </p>


            <p class="footer-text">
                Gemeinsam unsere Schule verbessern.
            </p>

        </section>

    </main>

</body>
</html>
